<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Patrimoine">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%BC%3C/text%3E%3C/svg%3E">
<title>Mon patrimoine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#020617;--card:#0f172a;--border:#1e293b;--txt:#e2e8f0;--muted:#94a3b8;--sky:#38bdf8;--green:#34d399;--rose:#fb7185}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:16px 16px 96px;max-width:560px;margin:0 auto}
button{font-family:inherit}
h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
header.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.date{font-size:12px;color:#64748b;text-transform:capitalize}
.badge{font-size:10px;font-weight:600;color:var(--muted);background:#1e293b;border-radius:999px;padding:4px 10px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted)}
.hero .total{font-size:36px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.pill{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;margin-top:10px}
.pill.up{background:rgba(52,211,153,.15);color:var(--green)}
.pill.down{background:rgba(251,113,133,.15);color:var(--rose)}
.stats{display:flex;gap:24px;margin-top:14px}
.stat .k{font-size:11px;color:var(--muted)}
.stat .v{font-size:16px;font-weight:700}
.row-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 12px;color:var(--txt);cursor:pointer;margin-bottom:8px}
.row-btn.sm{padding:8px 10px;margin-bottom:6px}
.env-ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.big{font-weight:700}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;color:var(--muted)}
.right{text-align:right;flex:none}
.grow{flex:1;min-width:0}
.up-t{color:var(--green);font-size:12px;font-weight:600}
.down-t{color:var(--rose);font-size:12px;font-weight:600}
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:18px 0 10px}
.donut-wrap{display:flex;gap:16px;align-items:center}
.donut{width:110px;height:110px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.donut-hole{width:62px;height:62px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-hole b{font-size:12px}
.legend{flex:1;min-width:0}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.val{color:var(--muted);white-space:nowrap}
.pct{color:var(--muted);width:38px;text-align:right}
.chart{width:100%;height:150px;display:block}
.note{font-size:11px;color:var(--muted);line-height:1.5;margin:8px 0}
.btn-primary{display:block;width:100%;background:var(--sky);color:#041022;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;margin:8px 0}
.btn-line{display:block;width:100%;background:var(--card);color:var(--txt);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;margin:8px 0}
.btn-del{display:block;width:100%;background:transparent;color:var(--rose);border:1px solid rgba(251,113,133,.4);border-radius:12px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;margin:8px 0}
.empty{text-align:center;padding:40px 0}
.empty .big-ic{font-size:44px}
.empty .t{font-weight:800;font-size:18px;margin-top:10px}
.empty .s{color:var(--muted);font-size:13px;margin-top:6px;padding:0 24px;line-height:1.5}
.seg{display:flex;gap:8px;margin:0 0 12px}
.seg button{flex:1;padding:9px 10px;border:1px solid var(--border);background:var(--card);border-radius:12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{color:#fff;border-color:var(--sky);background:rgba(56,189,248,.12)}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(2,6,23,.92);backdrop-filter:blur(8px);border-top:1px solid var(--border)}
.nav-in{display:flex;max-width:560px;margin:0 auto;padding:0 8px;align-items:center}
.tab{flex:1;background:none;border:none;color:#64748b;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;cursor:pointer}
.tab .ic{font-size:18px;line-height:1}
.tab.on{color:var(--sky)}
.fab{width:52px;height:52px;border-radius:50%;background:var(--sky);color:#041022;border:none;font-size:26px;font-weight:700;cursor:pointer;margin-top:-22px;flex:none}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(2,6,23,.7);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:16px;width:100%;max-width:560px;max-height:86vh;overflow:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-head h2{font-size:17px;font-weight:800}
.x-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.field input,.field select{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--txt);font-size:15px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.color-dots{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.color-dot{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.color-dot.sel{border-color:#fff}
.err{color:var(--rose);font-size:12px;font-weight:600;margin:6px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<script>
"use strict";

// ---------- Constantes ----------
var KEY = "suivi-patrimoine-v4";
var APP_VERSION = "v11";
var ENVELOPE_TYPES = ["PEA","PEA-PME","Assurance-vie","Compte-titres","Livret / Épargne","Compte courant","Immobilier","Crypto","SCPI","Crowdfunding","Autre"];
var CATEGORIES = ["Actions","ETF","Obligations","Fonds","Crypto","Immobilier","Liquidités","Métal","SCPI","Crowdfunding","Art","Défiscalisation","Autre"];
var PALETTE = ["#38bdf8","#34d399","#fbbf24","#f472b6","#a78bfa","#fb7185","#4ade80","#f97316","#22d3ee","#e879f9"];
var CAT_COLORS = {"Actions":"#38bdf8","ETF":"#34d399","Obligations":"#a78bfa","Fonds":"#fbbf24","Crypto":"#f472b6","Immobilier":"#f97316","Liquidités":"#4ade80","Métal":"#e879f9","SCPI":"#f59e0b","Crowdfunding":"#60a5fa","Art":"#e11d48","Défiscalisation":"#a16207","Autre":"#94a3b8"};
var TYPE_ICONS = {"PEA":"📈","PEA-PME":"📈","Assurance-vie":"🛡️","Compte-titres":"📊","Livret / Épargne":"🏦","Compte courant":"💳","Immobilier":"🏠","Crypto":"₿","SCPI":"🏢","Crowdfunding":"🤝","Autre":"📦"};
var TYPE_COLORS = {};
ENVELOPE_TYPES.forEach(function(t, i){ TYPE_COLORS[t] = PALETTE[i % PALETTE.length]; });

// ---------- Helpers ----------
function uid() {
  if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}
function fmtEur(n, dec) {
  if (dec === undefined) dec = 0;
  return new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: dec, maximumFractionDigits: dec }).format(n);
}
function fmtPct(n) {
  return (n >= 0 ? "+" : "") + new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 1 }).format(n) + " %";
}
function parseNum(v) {
  var n = parseFloat(String(v).replace(/\s/g, "").replace(",", "."));
  return isFinite(n) ? n : NaN;
}
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function assetValue(a) { return a.quantity * a.currentPrice; }
function assetInvested(a) { return a.quantity * a.buyPrice; }
function envValue(e) { return e.assets.reduce(function(s,a){ return s + assetValue(a); }, 0); }
function envInvested(e) { return e.assets.reduce(function(s,a){ return s + assetInvested(a); }, 0); }

// ---------- État ----------
var DEFAULT_DATA = { "savedAt": 0, "envelopes": [] };
function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var p = JSON.parse(raw);
      var pSaved = p.savedAt || 0;
      var dSaved = (DEFAULT_DATA && DEFAULT_DATA.savedAt) || 0;
      if (pSaved >= dSaved) {
        return {
          envelopes: Array.isArray(p.envelopes) ? p.envelopes : [],
          snapshots: Array.isArray(p.snapshots) ? p.snapshots : []
        };
      }
      // stockage plus ancien que le fichier ouvert -> ignorer
    }
  } catch (e) {}
  if (typeof DEFAULT_DATA !== "undefined" && DEFAULT_DATA && Array.isArray(DEFAULT_DATA.envelopes)) {
    return { envelopes: JSON.parse(JSON.stringify(DEFAULT_DATA.envelopes)), snapshots: [] };
  }
  return { envelopes: [], snapshots: [] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ envelopes: state.envelopes, snapshots: state.snapshots, savedAt: Date.now() })); } catch (e) {}
}
function recordSnapshot() {
  var total = state.envelopes.reduce(function(s,e){ return s + envValue(e); }, 0);
  var today = new Date().toISOString().slice(0, 10);
  var i = state.snapshots.findIndex(function(s){ return s.date === today; });
  var entry = { date: today, total: Math.round(total * 100) / 100 };
  if (i >= 0) state.snapshots[i] = entry;
  else state.snapshots.push(entry);
  state.snapshots.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  if (state.snapshots.length > 365) state.snapshots = state.snapshots.slice(-365);
  save();
}
var state = load();
var tab = "resume";
var openEnvId = null;
var assetSort = "value";
var PERSIST_MSG = "";

function makeSample() {
  return [
    { id: uid(), name: "PEA", type: "PEA", color: "#38bdf8", assets: [
      { id: uid(), name: "ETF MSCI World", category: "ETF", quantity: 8, buyPrice: 98.4, currentPrice: 112.6 },
      { id: uid(), name: "Airbus", category: "Actions", quantity: 10, buyPrice: 142, currentPrice: 158.5 }
    ]},
    { id: uid(), name: "Assurance-vie", type: "Assurance-vie", color: "#a78bfa", assets: [
      { id: uid(), name: "Fonds euros", category: "Fonds", quantity: 120, buyPrice: 100, currentPrice: 103.2 }
    ]},
    { id: uid(), name: "Livret A", type: "Livret / Épargne", color: "#34d399", assets: [
      { id: uid(), name: "Épargne de précaution", category: "Liquidités", quantity: 1, buyPrice: 7500, currentPrice: 7500 }
    ]}
  ];
}

// ---------- Fragments HTML ----------
function gainPill(gain, pct) {
  var pos = gain >= 0;
  return '<span class="pill ' + (pos ? "up" : "down") + '">' +
    (pos ? "▲" : "▼") + " " + fmtEur(Math.abs(gain)) + " (" + fmtPct(pct) + ")</span>";
}
function envelopeCard(env, noType) {
  var invested = envInvested(env);
  var value = envValue(env);
  var perf = invested > 0 ? ((value - invested) / invested) * 100 : null;
  return '<button class="row-btn" data-action="open-env" data-id="' + env.id + '">' +
    '<span class="env-ic" style="background:' + env.color + '26">' + (TYPE_ICONS[env.type] || "📦") + "</span>" +
    '<span class="grow"><span class="big ellipsis" style="display:block">' + esc(env.name) + "</span>" +
    '<span class="sub ellipsis" style="display:block">' + (noType ? "" : esc(env.type) + " · ") + env.assets.length + " actif" + (env.assets.length > 1 ? "s" : "") + "</span></span>" +
    '<span class="right"><span class="big" style="display:block">' + fmtEur(value) + "</span>" +
    (perf !== null ? '<span class="' + (perf >= 0 ? "up-t" : "down-t") + '">' + fmtPct(perf) + "</span>" : "") +
    "</span></button>";
}
function assetRow(asset, envName) {
  var v = assetValue(asset);
  var inv = assetInvested(asset);
  var gain = v - inv;
  return '<button class="row-btn sm" data-action="open-asset" data-env-id="' + asset.__envId + '" data-id="' + asset.id + '">' +
    '<span class="grow"><span class="big ellipsis" style="display:block">' + esc(asset.name) + "</span>" +
    '<span class="sub ellipsis" style="display:block">' + (envName ? esc(envName) + " · " : "") + esc(asset.category) + " · " + asset.quantity + " × " + fmtEur(asset.currentPrice, 2) + "</span></span>" +
    '<span class="right"><span class="big" style="display:block">' + fmtEur(v) + "</span>" +
    (inv > 0 ? '<span class="' + (gain >= 0 ? "up-t" : "down-t") + '">' + (gain >= 0 ? "+" : "") + fmtEur(gain) + " · " + fmtPct(gain / inv * 100) + "</span>" : "") +
    "</span></button>";
}
function donutCSS(data) {
  var total = data.reduce(function(s,d){ return s + d.value; }, 0);
  if (total <= 0) return "transparent";
  var stops = [], acc = 0;
  data.forEach(function(d) {
    var start = acc / total * 360; acc += d.value; var end = acc / total * 360;
    stops.push(d.color + " " + start.toFixed(2) + "deg " + end.toFixed(2) + "deg");
  });
  return "conic-gradient(" + stops.join(",") + ")";
}
function pieCard(title, data) {
  var total = data.reduce(function(s,d){ return s + d.value; }, 0);
  if (total <= 0) {
    return '<div class="card"><h3 class="sec" style="margin:0 0 4px">' + title + '</h3><p class="note" style="padding:16px 0;text-align:center">Aucun actif pour l\u2019instant.</p></div>';
  }
  var legend = data.map(function(d) {
    return '<div class="legend-item"><span class="dot" style="background:' + d.color + '"></span>' +
      '<span class="nm">' + esc(d.name) + '</span><span class="val">' + fmtEur(d.value) + "</span>" +
      '<span class="pct">' + Math.round(d.value / total * 100) + "%</span></div>";
  }).join("");
  return '<div class="card"><h3 class="sec" style="margin:0 0 10px">' + title + "</h3>" +
    '<div class="donut-wrap"><div class="donut" style="background:' + donutCSS(data) + '">' +
    '<div class="donut-hole"><b>Total</b><span style="font-size:11px;color:#94a3b8">' + fmtEur(total) + "</span></div></div>" +
    '<div class="legend">' + legend + "</div></div></div>";
}
function lineSVG(snaps, color) {
  if (snaps.length < 2) return "";
  var w = 320, h = 150, pad = 10;
  var vals = snaps.map(function(s){ return s.total; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var range = (max - min) || 1;
  var pts = snaps.map(function(s, i) {
    var x = pad + (i / (snaps.length - 1)) * (w - 2 * pad);
    var y = h - pad - ((s.total - min) / range) * (h - 2 * pad);
    return [x, y];
  });
  var line = pts.map(function(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
  var area = (pad + "," + (h - pad) + " ") + line + (" " + (w - pad) + "," + (h - pad));
  var last = pts[pts.length - 1];
  return '<svg class="chart" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none">' +
    '<polygon points="' + area + '" fill="' + color + '22"/>' +
    '<polyline points="' + line + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="4" fill="' + color + '"/></svg>';
}
function xLabels(snaps) {
  if (snaps.length < 2) return "";
  var fmt = new Intl.DateTimeFormat("fr-FR", { day: "2-digit", month: "2-digit" });
  var first = snaps[0], last = snaps[snaps.length - 1];
  return '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted)">' +
    '<span>' + fmt.format(new Date(first.date)) + "</span><span>" + fmt.format(new Date(last.date)) + "</span></div>";
}

// ---------- Vues ----------
function groupedEnvelopes() {
  var groups = {};
  state.envelopes.forEach(function(e){ (groups[e.type] = groups[e.type] || []).push(e); });
  var list = Object.keys(groups).map(function(t) {
    var envs = groups[t].slice().sort(function(a,b){ return envValue(b) - envValue(a); });
    var val = envs.reduce(function(s,e){ return s + envValue(e); }, 0);
    var inv = envs.reduce(function(s,e){ return s + envInvested(e); }, 0);
    return { type: t, envs: envs, value: val, inv: inv };
  }).sort(function(a,b){ return b.value - a.value; });
  return list.map(function(g) {
    var perf = g.inv > 0 ? ((g.value - g.inv) / g.inv) * 100 : null;
    return '<div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">' +
      '<span class="env-ic" style="width:34px;height:34px;border-radius:10px;font-size:16px;background:rgba(148,163,184,.15)">' + (TYPE_ICONS[g.type] || "📦") + "</span>" +
      '<span class="grow"><b style="display:block">' + esc(g.type) + "</b>" +
      '<span class="sub">' + g.envs.length + " enveloppe" + (g.envs.length > 1 ? "s" : "") + "</span></span>" +
      '<span class="right"><span class="big" style="display:block">' + fmtEur(g.value) + "</span>" +
      (perf !== null ? '<span class="' + (perf >= 0 ? "up-t" : "down-t") + '">' + fmtPct(perf) + "</span>" : "") +
      "</span></div>" +
      g.envs.map(function(e){ return envelopeCard(e, true); }).join("") +
      "</div>";
  }).join("");
}
function viewResume() {
  var total = state.envelopes.reduce(function(s,e){ return s + envValue(e); }, 0);
  var invested = state.envelopes.reduce(function(s,e){ return s + envInvested(e); }, 0);
  var gain = total - invested;
  var perf = invested > 0 ? (gain / invested) * 100 : 0;

  var html = '<div class="card hero"><div class="label">Patrimoine total</div>' +
    '<div class="total">' + fmtEur(total) + "</div>" +
    (invested > 0 ? gainPill(gain, perf) : "") +
    '<div class="stats"><div class="stat"><div class="k">Investi</div><div class="v">' + fmtEur(invested) + '</div></div>' +
    '<div class="stat"><div class="k">Enveloppes</div><div class="v">' + state.envelopes.length + "</div></div></div></div>";

  if (state.envelopes.length === 0) {
    html += '<div class="empty"><div class="big-ic">💼</div><p class="t">Bienvenue !</p>' +
      '<p class="s">Pour tout récupérer d\u2019un coup : onglet Historique → Importer CSV (ton fichier Finary). Sinon, crée ta première enveloppe avec le bouton ＋ ci-dessous.</p></div>';
    return html;
  }

  var typeGroups = {};
  state.envelopes.forEach(function(e){ typeGroups[e.type] = (typeGroups[e.type] || 0) + envValue(e); });
  var envData = Object.keys(typeGroups).map(function(t){ return { name: t, value: typeGroups[t], color: TYPE_COLORS[t] || "#94a3b8" }; })
    .sort(function(a,b){ return b.value - a.value; });
  var catMap = {};
  state.envelopes.forEach(function(e) {
    e.assets.forEach(function(a) {
      catMap[a.category] = (catMap[a.category] || 0) + assetValue(a);
    });
  });
  var catData = Object.keys(catMap).map(function(k){ return { name: k, value: catMap[k], color: CAT_COLORS[k] || "#94a3b8" }; })
    .sort(function(a,b){ return b.value - a.value; });

  html += pieCard("Répartition par type", envData);
  html += pieCard("Répartition par catégorie", catData);
  if (state.snapshots.length >= 2) {
    html += '<div class="card"><h3 class="sec" style="margin:0 0 10px">Évolution du patrimoine</h3>' +
      lineSVG(state.snapshots, "#38bdf8") + xLabels(state.snapshots) + "</div>";
  }
  html += '<h3 class="sec">Mes enveloppes</h3>' + groupedEnvelopes();
  return html;
}
function viewEnvelopeDetail(env) {
  var invested = envInvested(env);
  var value = envValue(env);
  var gain = value - invested;
  var perf = invested > 0 ? (gain / invested) * 100 : 0;
  var html = '<button class="btn-line" data-action="back" style="margin-bottom:12px">← Retour</button>' +
    '<div class="card"><div style="display:flex;align-items:center;gap:12px">' +
    '<span class="env-ic" style="background:' + env.color + '26">' + (TYPE_ICONS[env.type] || "📦") + "</span>" +

  input.value = "";
  input.onchange = function() {
    var file = input.files && input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      try {
        var p = JSON.parse(reader.result);
        if (!p || !Array.isArray(p.envelopes)) throw new Error("fichier invalide");
        state = {
          envelopes: p.envelopes,
          snapshots: Array.isArray(p.snapshots) ? p.snapshots : []
        };
        save(); recordSnapshot(); render();
        alert("Données importées : " + state.envelopes.length + " enveloppe(s).");
      } catch (err) {
        alert("Import impossible : " + err.message);
      }
    };
    reader.readAsText(file);
  };

function normHeader(s) {
  return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[\u2019\u2018\u02bc`]/g, "'").toLowerCase().trim();
}
function detectSep(line) {
  var s = 0, c = 0, t = 0;
  for (var i = 0; i < line.length; i++) {
    if (line[i] === ";") s++;
    else if (line[i] === ",") c++;
    else if (line[i] === "\t") t++;
  }
  if (s >= c && s >= t) return ";";
  if (t > c) return "\t";
  return ",";
}
function parseCSVLine(line, sep) {
  var out = [], cur = "", inQ = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (inQ) {
      if (ch === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else inQ = false;
      } else cur += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === sep) { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}
function stripNum(v) {
  return String(v == null ? "" : v)
    .replace(/[\s\u00a0\u202f\u2009]/g, "")
    .replace(/[€$£]/g, "")
    .trim();
}
function parseNumWith(s, decSep) {
  s = stripNum(s);
  if (s === "" || s === "-") return NaN;
  if (/^\(.*\)$/.test(s)) s = "-" + s.slice(1, -1);
  if (decSep === ",") s = s.replace(/\./g, "").replace(/,/g, ".");
  else s = s.replace(/,/g, "");
  if (!/^[-+]?[\d]*\.?[\d]+$/.test(s)) return NaN;
  var n = parseFloat(s);
  return isFinite(n) ? n : NaN;
}
function parseNumAuto(s) {
  s = stripNum(s);
  if (s === "") return NaN;
  var lastDot = s.lastIndexOf(".");
  var lastCom = s.lastIndexOf(",");
  var dec = ".";
  if (lastDot >= 0 && lastCom >= 0) dec = (lastCom > lastDot) ? "," : ".";
  else if (lastCom >= 0) dec = ",";
  return parseNumWith(s, dec);
}
function decideDecSep(vals) {
  var dot = 0, comma = 0;
  vals.forEach(function(v) {
    var s = stripNum(v);
    if (/\.\d{1,2}$/.test(s)) dot++;
    if (/,\d{1,2}$/.test(s)) comma++;
  });
  return comma > dot ? "," : ".";
}
var CSV_SYN = {
  env: { exact: ["enveloppe", "compte", "envelope", "portefeuille", "institution", "banque", "courtier"] },

function aliasEnvType(v) {

function detectColumns(cols) {
  var map = { env: -1, name: -1, qty: -1, buy: -1, cur: -1, color: -1, typeCand: [], typeCol: -1, catCol: -1 };
  var used = {};
  function take(idx) {
    if (idx < 0 || used[idx]) return false;
    used[idx] = true;
    return true;
  }
  for (var i = 0; i < cols.length; i++) {
    var c = cols[i];
    if (c === "") continue;
    if (map.env < 0 && CSV_SYN.env.exact.indexOf(c) >= 0) { map.env = i; take(i); continue; }
    if (map.name < 0 && CSV_SYN.name.exact.indexOf(c) >= 0) { map.name = i; take(i); continue; }
    if (map.color < 0 && CSV_SYN.color.exact.indexOf(c) >= 0) { map.color = i; take(i); continue; }
    if (map.qty < 0 && CSV_SYN.qty.exact.indexOf(c) >= 0) { map.qty = i; take(i); continue; }
  }
  for (var j = 0; j < cols.length; j++) {
    var h = cols[j];
    if (h === "" || used[j]) continue;
    if (map.buy < 0) {
      var okBuy = false;
      for (var k = 0; k < CSV_SYN.buy.contains.length; k++) {
        if (h.indexOf(CSV_SYN.buy.contains[k]) >= 0) { okBuy = true; break; }
      }
      if (okBuy) {
        var bad = false;
        for (var k2 = 0; k2 < CSV_SYN.buy.not.length; k2++) {
          if (h.indexOf(CSV_SYN.buy.not[k2]) >= 0) { bad = true; break; }
        }
        if (!bad) { map.buy = j; take(j); continue; }
      }
    }
    if (map.cur < 0) {
      var okCur = false;
      for (var k3 = 0; k3 < CSV_SYN.cur.contains.length; k3++) {
        if (h.indexOf(CSV_SYN.cur.contains[k3]) >= 0) { okCur = true; break; }
      }
      if (okCur) {
        var bad2 = false;
        for (var k4 = 0; k4 < CSV_SYN.cur.not.length; k4++) {
          if (h.indexOf(CSV_SYN.cur.not[k4]) >= 0) { bad2 = true; break; }
        }
        if (!bad2) { map.cur = j; take(j); continue; }
      }
    }
    if (CSV_SYN.type.exact.indexOf(h) >= 0) map.typeCand.push(j);
    if (CSV_SYN.cat.exact.indexOf(h) >= 0) map.catCol = j;
  }
  return map;
}
function typeMatchRatio(rows, colIdx) {
  if (colIdx < 0) return 0;
  var match = 0, total = 0;
  for (var i = 1; i < rows.length && i <= 60; i++) {
    var cells = rows[i];
    if (!cells || colIdx >= cells.length) continue;
    var v = String(cells[colIdx] || "").trim();
    if (!v) continue;
    total++;
    if (aliasEnvType(v)) match++;
  }
  return total > 0 ? match / total : 0;
}
function importCSVText(text) {
  if (!text || !String(text).trim()) throw new Error("fichier vide");
  text = String(text).replace(/^\uFEFF/, "");
  var lines = text.split(/\r\n|\r|\n/).filter(function(l) { return l.trim() !== ""; });
  if (lines.length < 2) throw new Error("aucune donnée trouvée");
  // détection du séparateur : colonnes stables et les plus nombreuses
  var seps = [";", ",", "\t"];
  var sep = null, bestScore = -1, bestRef = 0;
  for (var si = 0; si < seps.length; si++) {
    var sp = seps[si];
    var ref = parseCSVLine(lines[0], sp).length;
    var score = 0, count = 0;
    for (var li = 0; li < lines.length && li < 30; li++) {
      var n = parseCSVLine(lines[li], sp).length;
      score += Math.abs(n - ref);
      count++;
    }
    score = score / Math.max(1, count);
    if (ref < 2) continue;
    if (bestScore < 0 || score < bestScore || (score === bestScore && ref > bestRef)) {
      bestScore = score; bestRef = ref; sep = sp;
    }
  }
  if (!sep) throw new Error("séparateur non détecté");
  var rows = lines.map(function(l) { return parseCSVLine(l, sep); });
  var headers = rows[0].map(normTxt);
  var map = detectColumns(headers);
  if (map.env < 0 || map.name < 0 || map.buy < 0 || map.cur < 0) {
    if (rows[0].length === 8) {
      map.env = 0; map.name = 3; map.qty = 5; map.buy = 6; map.cur = 7;
      map.typeCol = 1; map.catCol = 4; map.color = 2;
    } else {
      throw new Error("colonnes attendues : Enveloppe, Actif, Prix d'achat (ou Investi), Valeur actuelle");
    }
  } else {
    // désambiguïsation Type vs Catégorie par le contenu
    var cands = map.typeCand.slice(0);
    if (map.catCol >= 0 && cands.indexOf(map.catCol) < 0) cands.push(map.catCol);
    cands.sort(function(a, b) { return a - b; });
    if (cands.length > 0) {
      var bestCol = -1, bestRatio = 0;
      for (var ci = 0; ci < cands.length; ci++) {
        var r = typeMatchRatio(rows, cands[ci]);
        if (r > bestRatio) { bestRatio = r; bestCol = cands[ci]; }
      }
      if (bestRatio >= 0.1) {
        map.typeCol = bestCol;
        map.catCol = -1;
        for (var ci2 = 0; ci2 < cands.length; ci2++) {
          if (cands[ci2] !== bestCol) { map.catCol = cands[ci2]; break; }
        }
      } else {
        map.catCol = cands[0];
        map.typeCol = -1;
      }
    }
  }
  // décimales par colonne
  var buyVals = [], curVals = [], qtyVals = [];
  for (var r2 = 1; r2 < rows.length; r2++) {
    if (rows[r2][map.buy] !== undefined) buyVals.push(rows[r2][map.buy]);
    if (rows[r2][map.cur] !== undefined) curVals.push(rows[r2][map.cur]);
    if (map.qty >= 0 && rows[r2][map.qty] !== undefined) qtyVals.push(rows[r2][map.qty]);
  }
  var buyDec = decideDecSep(buyVals);
  var curDec = decideDecSep(curVals);
  var qtyDec = decideDecSep(qtyVals);
  // import avec fusion
  var added = 0, updated = 0, newEnv = 0, skipped = 0;
  for (var r3 = 1; r3 < rows.length; r3++) {
    var cells = rows[r3];
    var envName = String(cells[map.env] || "").trim();
    var assetName = String(cells[map.name] || "").trim();
    if (!envName || !assetName || envName === "—" || assetName === "—" ||
        /^(total|somme|solde total)/i.test(envName) || /^(total)/i.test(assetName)) {
      skipped++;
      continue;
    }
    var b = parseNumWith(cells[map.buy], buyDec);
    var v = parseNumWith(cells[map.cur], curDec);
    var q = (map.qty >= 0) ? parseNumWith(cells[map.qty], qtyDec) : 1;
    if (isNaN(q) || q <= 0) q = 1;
    if (isNaN(b) && !isNaN(v)) b = 0;
    if (isNaN(v) && !isNaN(b)) v = b;
    if (isNaN(b) || isNaN(v)) { skipped++; continue; }
    if (b === 0 && v === 0) { skipped++; continue; }
    var typeVal = (typeof map.typeCol === "number" && map.typeCol >= 0) ? String(cells[map.typeCol] || "").trim() : "";
    var catVal = (typeof map.catCol === "number" && map.catCol >= 0) ? aliasAssetCat(cells[map.catCol]) : null;
    var colorVal = (map.color >= 0) ? String(cells[map.color] || "").trim() : "";
    var env = null, envLow = envName.toLowerCase();
    for (var ei = 0; ei < state.envelopes.length; ei++) {
      if (state.envelopes[ei].name.toLowerCase() === envLow) { env = state.envelopes[ei]; break; }
    }
    if (!env) {
      var t = aliasEnvType(typeVal) || "Autre";
      var col = /^#[0-9a-f]{3,8}$/i.test(colorVal) ? colorVal : PALETTE[(newEnv + state.envelopes.length) % PALETTE.length];
      env = { id: uid(), name: envName, type: t, color: col, assets: [] };
      state.envelopes.push(env);
      newEnv++;
    }
    var asset = null, assetLow = assetName.toLowerCase();
    for (var ai = 0; ai < env.assets.length; ai++) {
      if (env.assets[ai].name.toLowerCase() === assetLow) { asset = env.assets[ai]; break; }
    }
    if (asset) {
      asset.quantity = q; asset.buyPrice = b; asset.currentPrice = v;
      if (catVal) asset.category = catVal;
      updated++;
    } else {
      env.assets.push({ id: uid(), name: assetName, category: catVal || "Autre", quantity: q, buyPrice: b, currentPrice: v });
      added++;
    }
  }
  if (added + updated === 0) throw new Error("aucune ligne exploitable trouvée");
  return "Import CSV : " + (added + updated) + " actif(s) traité(s) — " + added + " ajouté(s) — " +
    updated + " mis à jour — " + newEnv + " nouvelle(s) enveloppe(s) — " + skipped + " ligne(s) ignorée(s)";
}
function importCSV() {
  var input = document.getElementById("import-csv-file");
  if (!input) return;
  input.value = "";
  input.onchange = function() {
    var file = input.files && input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      try {
        var msg = importCSVText(reader.result);
        save(); recordSnapshot(); render();
        alert(msg);
      } catch (err) {
        alert("Import CSV impossible : " + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}
function handleFab() {
  var env = state.envelopes.find(function(e){ return e.id === openEnvId; });
  if (tab === "enveloppes" && env) openAssetForm(env.id, null);
  else if (tab === "actifs" && state.envelopes.length > 0) openAssetForm(null, null);
  else openEnvForm(null);
}

// ---------- Événements ----------
document.getElementById("app").addEventListener("click", function(e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var act = el.dataset.action;
  if (act === "tab") { tab = el.dataset.tab; openEnvId = null; render(); }
  else if (act === "fab") handleFab();
  else if (act === "open-env") { openEnvId = el.dataset.id; tab = "enveloppes"; render(); }
  else if (act === "back") { openEnvId = null; render(); }
  else if (act === "add-env") openEnvForm(null);
  else if (act === "edit-env") openEnvForm(state.envelopes.find(function(x){ return x.id === el.dataset.id; }));
  else if (act === "add-asset") openAssetForm(el.dataset.id, null);
  else if (act === "open-asset") {
    var env = state.envelopes.find(function(x){ return x.id === el.dataset.envId; });
    if (!env) return;
    var asset = env.assets.find(function(a){ return a.id === el.dataset.id; });
    if (asset) openAssetForm(env.id, asset);
  }
  else if (act === "sort-assets") { assetSort = el.dataset.sort; render(); }
  else if (act === "export-data") exportData();
  else if (act === "import-data") importData();
  else if (act === "export-csv") exportCSV();
  else if (act === "import-csv") importCSV();
});
modalRoot.addEventListener("click", function(e) {
  if (e.target.hasAttribute && e.target.hasAttribute("data-overlay")) { closeModal(); return; }
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var act = el.dataset.action;
  if (act === "close-modal") closeModal();
  else if (act === "pick-color") {
    formColor = el.dataset.color;
    var dots = modalRoot.querySelectorAll(".color-dot");
    for (var i = 0; i < dots.length; i++) {
      dots[i].classList.toggle("sel", dots[i].dataset.color === formColor);
    }
  }
  else if (act === "del-env") {
    if (el.classList.contains("confirm")) deleteEnvelope(el.dataset.id);
    else { el.classList.add("confirm"); el.textContent = "Confirmer la suppression ?"; }
  }
  else if (act === "del-asset") {
    if (el.classList.contains("confirm")) deleteAsset(el.dataset.envId, el.dataset.id);
    else { el.classList.add("confirm"); el.textContent = "Confirmer la suppression ?"; }
  }
});

// ---------- Démarrage ----------
try {
  if (typeof navigator !== "undefined" && navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().then(function(ok){
      PERSIST_MSG = ok ? "Stockage permanent activé : ton téléphone ne nettoie pas ces données." : "Pense à faire un export JSON de temps en temps par sécurité.";
      render();
    }).catch(function(){});
  }
} catch (e) {}
if (typeof navigator !== "undefined" && navigator.serviceWorker) {
  try { navigator.serviceWorker.register("sw.js").catch(function(){}); } catch (e) {}
}
closeModal();
recordSnapshot();
render();
</script>
